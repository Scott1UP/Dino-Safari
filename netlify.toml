# Netlify build settings. The build needs no API keys: all generated art and sound is already checked in
# under public/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # The Vite version in this project needs a recent Node.
  NODE_VERSION = "22"
  # Once the site has an address, set SITE_URL here (see vite.config.ts): the link-preview tags need full
  # addresses, and Netlify's own URL goes stale if the site is renamed after a build.
